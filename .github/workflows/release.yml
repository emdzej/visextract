name: Release

# Triggered by plain semver tags (no "v" prefix): bump `version` in main.go, then
# `git tag 0.1.0 && git push origin 0.1.0`. Builds visextract for Linux, macOS and Windows
# (amd64 and arm64), packs each with LICENSE and README.md, and attaches the archives and
# their SHA-256 sums to a GitHub Release. workflow_dispatch builds the same files as artifacts only.

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: write   # to create the Release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: version
        id: ver
        run: |
          code=$(sed -n 's/^var version = "\(.*\)"/\1/p' main.go)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            v="$GITHUB_REF_NAME"
            if [[ "$v" != "$code" ]]; then
              echo "::error::tag $v does not match version \"$code\" in main.go"
              exit 1
            fi
          else
            v="$code-snapshot.${GITHUB_SHA::7}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: test
        run: go vet ./... && go test ./...

      - name: build
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}
            name="visextract-$V-$os-$arch"
            exe=visextract; [[ $os == windows ]] && exe=visextract.exe
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$V" \
              -o "build/$name/$exe" .
            cp LICENSE README.md "build/$name/"
            if [[ $os == windows ]]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          cd dist
          for f in ./*; do sha256sum "${f#./}" > "${f#./}.sha256"; done
          sha256sum -- *.tar.gz *.zip > SHA256SUMS
          ls -l

      - name: smoke test
        run: |
          out=$(build/visextract-${{ steps.ver.outputs.version }}-linux-amd64/visextract version)
          echo "$out"
          [[ "$out" == "${{ steps.ver.outputs.version }}" ]]

      - uses: actions/upload-artifact@v7
        with:
          name: visextract-${{ steps.ver.outputs.version }}
          path: dist/*
          retention-days: 14

      - name: create release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.version }}
        run: gh release create "$V" dist/* --title "visextract $V" --generate-notes --verify-tag
